<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A greeting page with vanilla JavaScript" />
    <title>Greeting Generator — Vanilla JavaScript</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="greeting-card" aria-labelledby="page-title">
        <p class="eyebrow">Checkpoint 02 · Vanilla JavaScript</p>
        <h1 id="page-title">Greeting Generator</h1>
        <p class="intro">JavaScript listens for an event and updates the DOM.</p>

        <form id="greeting-form" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" placeholder="Ada Lovelace" autocomplete="name" />
          </div>
          <button type="submit">Generate greeting</button>
        </form>

        <div id="result" class="result" aria-live="polite">
          <p>Your greeting will appear here.</p>
        </div>
        <p class="counter">Greetings generated: <strong id="count">0</strong></p>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
