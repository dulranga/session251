<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A vanilla JavaScript frontend connected to a Node API" />
    <title>Greeting Generator — Node API</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="greeting-card" aria-labelledby="page-title">
        <p class="eyebrow">Checkpoint 03 · Browser + Node API</p>
        <h1 id="page-title">Greeting Generator</h1>
        <p class="intro">The browser sends JSON. Node processes it and sends JSON back.</p>

        <form id="greeting-form" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" placeholder="Grace Hopper" autocomplete="name" />
          </div>
          <button id="submit-button" type="submit">Ask the server</button>
        </form>

        <div id="result" class="result" aria-live="polite">
          <p>Your server-generated greeting will appear here.</p>
        </div>
        <p class="counter">Requests attempted: <strong id="count">0</strong></p>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
</html>
